# crates/kaikei-e2e/Cargo.toml
#
# PR-8: 合成ルートを模したE2Eテスト専用crate。ビジネスロジックを持たない。
# kaikei-store は kaikei-jp/kaikei-policy を知らず、kaikei-jp も
# kaikei-store（infra）を知らない（CLAUDE.md §1）。両方を知ってよい
# 最上位の層としてこのcrateを新設した（DECISIONS.md D-068）。
# 他のどのcrateからも依存されないことを CI（architecture.yml）が検査する。

[package]
name = "kaikei-e2e"
version = "0.0.1"
description = "合成ルートを模したE2Eテスト専用crate（他のどのcrateからも依存されない）"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kaikei-core = { path = "../kaikei-core", version = "0.0.1" }
kaikei-policy = { path = "../kaikei-policy", version = "0.0.1" }
kaikei-jp = { path = "../kaikei-jp", version = "0.0.1" }
kaikei-jp-data = { path = "../kaikei-jp-data", version = "0.0.1" }
kaikei-app = { path = "../kaikei-app", version = "0.0.1" }
kaikei-store = { path = "../kaikei-store", version = "0.0.1" }
# Phase 3 PR-F: MCP の書き込み系ツールを**実 PostgreSQL に対して**通す。
#
# ★なぜ kaikei-mcp 側に置けないのか★
# kaikei-mcp は sqlx に依存しない（docs/07-mcp-server.md §10 MC-30 の許可リスト）
# ため、`#[sqlx::test]` で使い捨てDBを作れず、audit_log を SELECT する手段も無い。
# 「記帳が失敗しても監査ログには2行残る」を確かめるには、仕訳を書ける使い捨てDBと
# SQL の両方が要る。それを持っているのはこの crate だけである（同 §10 の
# 「実 DB に仕訳を書くテストは kaikei-e2e 側に置く」）。
#
# 依存の向きは kaikei-e2e → kaikei-mcp であり、「kaikei-e2e は誰からも
# 依存されない」（DECISIONS.md D-068、architecture.yml が検査）は保たれる。
kaikei-mcp = { path = "../kaikei-mcp", version = "0.0.1" }
sqlx = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[features]
# 既定オフ。PostgreSQL を要する E2E テストをゲートする（kaikei-store と同じ
# 方式。`#[ignore]` は使わない。ローカルで無言にスキップされ、通っていない
# テストを通ったと錯覚することを防ぐため）。
pg-tests = []

# `tests/*.rs` を pg-tests 未指定時はコンパイル自体しない
# （DB不在の `cargo test --workspace` を汚さない）。
[[test]]
name = "e2e_jp"
path = "tests/e2e_jp.rs"
required-features = ["pg-tests"]

[[test]]
name = "mcp_write_tools"
path = "tests/mcp_write_tools.rs"
required-features = ["pg-tests"]

# Phase 3 PR-H: MCP の読み取り系ツール（search_entries / get_ledger）を
# 実 PostgreSQL に対して通す（置き場の理由は mcp_write_tools と同じ）。
[[test]]
name = "mcp_search_ledger"
path = "tests/mcp_search_ledger.rs"
required-features = ["pg-tests"]

# Phase 3 PR-F レビュー4巡目: **実バイナリを stdio で起動して tools/call を
# 通す**振る舞い検査。ソース走査が3巡続けて外側から破られたことへの回答で
# あり、監査ログが2行残ることをプロトコルの入口から確かめる唯一の経路。
# 実行前に `cargo build -p kaikei-mcp` が要る（CARGO_BIN_EXE_* は同じ package の
# テストにしか渡らない。テスト側が理由を書いて落ちる）。
[[test]]
name = "mcp_stdio_server"
path = "tests/mcp_stdio_server.rs"
required-features = ["pg-tests"]
