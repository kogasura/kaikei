# kaikei-jp-data/tax/jp/2026.yaml
#
# 消費税区分マスタ。税率も控除割合もここにだけ書く。
# コードに税率をハードコードしないこと。
# 改正が来たら新しい年度ファイルを追加する（既存ファイルは編集しない）。
#
# ★ 内容は公開情報の整理であり、税務上の正しさを保証しない。
#   経過措置の控除割合など、適用前に必ず税理士と国税庁の一次情報で確認すること。
#
# rate は必ず「文字列」で書く（YAML の float は誤差が出るため）

version: 1
country: JP
applies_from: 2026-01-01
applies_to: null           # null なら次の年度ファイルまで有効

settings_defaults:
  tax_mode: exclusive      # exclusive（税抜経理） | inclusive（税込経理）
  rounding: floor          # floor | ceil | half_up
  rounding_unit: line      # line（明細ごと） | document（請求書単位）

categories:
  # ---- 課税売上 ----
  - code: SALES_10
    label: "課税売上 10%"
    direction: sales
    rate: "0.10"
    tax_account: "330"       # 仮受消費税等

  - code: SALES_8_REDUCED
    label: "課税売上 8%（軽減税率）"
    direction: sales
    rate: "0.08"
    tax_account: "330"

  - code: SALES_EXPORT
    label: "免税売上（輸出）"
    direction: sales
    rate: "0"
    tax_account: null

  # ---- 課税仕入（適格請求書あり）----
  - code: PURCHASE_10_QUALIFIED
    label: "課税仕入 10%（適格）"
    direction: purchase
    rate: "0.10"
    deductible: true
    deduction_ratio: "1.0"
    requires_qualified_invoice: true
    tax_account: "180"       # 仮払消費税等

  - code: PURCHASE_8_REDUCED_QUALIFIED
    label: "課税仕入 8%（軽減・適格）"
    direction: purchase
    rate: "0.08"
    deductible: true
    deduction_ratio: "1.0"
    requires_qualified_invoice: true
    tax_account: "180"

  # ---- 課税仕入（非適格・経過措置）----
  # ★ 控除割合は経過措置の段階により変わる。適用時期は必ず確認すること
  - code: PURCHASE_10_NON_QUALIFIED
    label: "課税仕入 10%（非適格・経過措置）"
    direction: purchase
    rate: "0.10"
    deductible: true
    deduction_ratio: "0.80"   # ★要確認：適用期間により 0.80 / 0.50 / 0
    requires_qualified_invoice: false
    tax_account: "180"
    note: "控除できない部分の処理方法は税理士に確認（docs/08-compliance.md §9-1）"

  # ---- 税額計算をしないもの ----
  - code: TAX_FREE
    label: "非課税"
    direction: none
    rate: null

  - code: OUT_OF_SCOPE
    label: "不課税"
    direction: none
    rate: null

  - code: NOT_APPLICABLE
    label: "対象外"
    direction: none
    rate: null
    note: "資産・負債の振替など、消費税と無関係な取引に使う"
