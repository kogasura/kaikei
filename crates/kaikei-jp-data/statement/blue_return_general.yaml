# 青色申告決算書（一般用）への当てはめ — 損益計算書（決算書1ページ）
#
# 出典: 国税庁「令和7年分 青色申告決算書（一般用）の書き方」
#   https://www.nta.go.jp/taxes/shiraberu/shinkoku/tebiki/2025/pdf/037.pdf
#   （2026-08-13 に様式を確認。欄番号・空欄の行数は様式の印字どおり）
#
# ■ これは様式そのものではない（docs/10-report.md §5、CLAUDE.md §10）
#
# ここで決めるのは「どの勘定科目をどの欄に足すか」だけである。決算書の
# 帳票（PDF）は作らない。国税庁の様式を模した帳票を出すのは、様式の
# 正確さに責任を持つことになるため。
#
# ■ 未マッピングの科目は黙って「その他」に入れない
#
# この表に出てこない科目は、どの欄にも足さず**一覧して知らせる**。
# 利用者が独自に足した科目をソフトが勝手に雑費へ寄せると、決算書の内訳が
# 黙って変わる。どの欄に入れるかは利用者（または税理士）が決める。
#
# ■ 税務判断を含む当てはめ
#
# - `530 受取利息` はこの表に**意図的に含めない**。預貯金の利子は所得税法上
#   利子所得（源泉分離課税・申告不要）であって事業所得ではないため、
#   売上（収入）金額に入れると事業所得を過大にする。未マッピングとして
#   報告し、利用者が事業主借へ振り替えるか判断する
# - `600 租税公課` は、税込経理で消費税等の納付税額があるときはその額を
#   含める欄である（様式の書き方 ⑧ の説明）。消費税の納付税額の計上は
#   このマッピングでは行わない（決算整理の話であり、帳簿側の仕訳で表す）

version: 1
form: "青色申告決算書（一般用）"
part: "損益計算書"
source: "令和7年分 青色申告決算書（一般用）の書き方（国税庁）"

# 様式に印字されている欄。`no` は様式の丸番号。
#
# `computed` の欄は勘定科目からではなく他の欄から計算する。計算式は
# 様式の印字（例: ④ 小計（②＋③））をそのまま写している。
fields:
  # ---- 売上（収入）金額 ----
  - no: 1
    label: "売上（収入）金額（雑収入を含む）"
    accounts: ["500", "510", "520"]

  # ---- 売上原価 ----
  - no: 2
    label: "期首商品（製品）棚卸高"
    accounts: ["550"]
  - no: 3
    label: "仕入金額（製品製造原価）"
    accounts: ["555"]
  - no: 4
    label: "小計"
    computed: "2+3"
  - no: 5
    label: "期末商品（製品）棚卸高"
    accounts: ["560"]
  - no: 6
    label: "差引原価"
    computed: "4-5"
  - no: 7
    label: "差引金額"
    computed: "1-6"

  # ---- 経費 ----
  # 様式に固有の欄がある科目。同梱の勘定科目テンプレートは、この欄名に
  # 合わせて科目名を付けてある（600〜616 が ⑧〜㉔ に素直に対応する）。
  - no: 8
    label: "租税公課"
    accounts: ["600"]
  - no: 9
    label: "荷造運賃"
    accounts: ["601"]
  - no: 10
    label: "水道光熱費"
    accounts: ["602"]
  - no: 11
    label: "旅費交通費"
    accounts: ["603"]
  - no: 12
    label: "通信費"
    accounts: ["604"]
  - no: 13
    label: "広告宣伝費"
    accounts: ["605"]
  - no: 14
    label: "接待交際費"
    accounts: ["606"]
  - no: 15
    label: "損害保険料"
    accounts: ["607"]
  - no: 16
    label: "修繕費"
    accounts: ["608"]
  - no: 17
    label: "消耗品費"
    accounts: ["609"]
  - no: 18
    label: "減価償却費"
    accounts: ["610"]
  - no: 19
    label: "福利厚生費"
    accounts: ["611"]
  - no: 20
    label: "給料賃金"
    accounts: ["612"]
  - no: 21
    label: "外注工賃"
    accounts: ["613"]
  - no: 22
    label: "利子割引料"
    accounts: ["614"]
  - no: 23
    label: "地代家賃"
    accounts: ["615"]
  - no: 24
    label: "貸倒金"
    accounts: ["616"]

  # 様式の空欄（㉕〜㉚ の6行）。利用者が科目名を書き込む行なので、
  # **欄名も金額も帳簿の科目から埋める**。
  #
  # 同梱テンプレートのうち、決算書に固有の欄が無い経費科目をここに置く。
  # 6行しかないため、7科目以上になったら収まらない——そのときは黙って
  # 詰めず、収まらないことを知らせる（出力側の責務）。
  - no: 25
    label: null
    accounts: ["620"] # 支払手数料
  - no: 26
    label: null
    accounts: ["621"] # 新聞図書費
  - no: 27
    label: null
    accounts: ["622"] # 研修費
  - no: 28
    label: null
    accounts: ["623"] # 会議費
  - no: 29
    label: null
    accounts: ["624"] # 車両費
  - no: 30
    label: null
    accounts: ["625"] # 諸会費

  - no: 31
    label: "雑費"
    accounts: ["690"]
  - no: 32
    label: "計"
    computed: "sum(8..31)"
  - no: 33
    label: "差引金額"
    computed: "7-32"

  # ---- 各種引当金・準備金等 ----
  # 同梱テンプレートには引当金・専従者給与の科目が無いため、当てはめる科目を
  # 持たない欄が並ぶ。**欄ごと消さずに 0 円の欄として残す**——欄が無いと、
  # 「様式に無い」のか「当てはめていない」のかが読めなくなる。また ㊲ や ㊷ の
  # 計は個々の欄を参照するので、参照先の欄が実在しないと集計が成り立たない。
  #
  # 専従者給与は、青色事業専従者に支給した給与を入れる欄である（様式の
  # 書き方 ⑳ の説明。給料賃金⑳には入れない）。専従者がいる場合は利用者が
  # 科目を足し、この欄に当てはめる。
  - no: 34
    label: "貸倒引当金（繰戻額）"
    accounts: []
  - no: 35
    label: null
    accounts: []
  - no: 36
    label: null
    accounts: []
  - no: 37
    label: "繰戻額等 計"
    computed: "sum(34..36)"
  - no: 38
    label: "専従者給与"
    accounts: []
  - no: 39
    label: "貸倒引当金（繰入額）"
    accounts: []
  - no: 40
    label: null
    accounts: []
  - no: 41
    label: null
    accounts: []
  - no: 42
    label: "繰入額等 計"
    computed: "sum(38..41)"

  # ---- 所得金額 ----
  - no: 43
    label: "青色申告特別控除前の所得金額"
    computed: "33+37-42"
  - no: 44
    label: "青色申告特別控除額"
    # 帳簿の科目からは決まらない。控除額の要件（複式簿記・e-Tax申告・
    # 優良な電子帳簿保存）を満たすかはソフトが判定せず、利用者が指定する。
    from_input: "blue_return_deduction"
    # **控除額は青色申告特別控除前の所得金額を限度とする。**
    # 措置法25条の2。タックスアンサー No.2072「不動産所得の金額または
    # 事業所得の金額の合計額が55万円より少ない場合には、その合計額が
    # 限度になります」。赤字なら控除は0（「その損失をないものとして
    # 合計額を計算します」）。
    capped_by: 43
  - no: 45
    label: "所得金額"
    computed: "43-44"

# この表に出てこない科目のうち、**意図して載せていない**もの。
# 「まだ当てはめていない」のか「載せないと決めた」のかを区別できるように、
# 理由を添えて明示する。
excluded:
  - account: "530"
    reason: "預貯金の利子は利子所得（源泉分離課税・申告不要）であり事業所得ではない。売上（収入）金額に入れると事業所得を過大にする"
