# kaikei-jp-data/tags.yaml
#
# タグスキーマ。kaikei-core が未登録キーを拒否するため、
# 新しいタグを使う前に必ずここへ登録する。
#
# value_type:   Code | Text | Decimal | Date
# aggregatable: true なら TrialBalance の group_by に使える
# required_for: この科目種別の明細では必須（Asset/Liability/Equity/Revenue/Expense）

version: 1

tags:
  tax_category:
    value_type: Code
    aggregatable: true
    required_for: [Revenue, Expense]
    description: "消費税区分。tax/jp/{year}.yaml の categories[].code を参照"

  entry_kind:
    value_type: Code
    # 集計軸にはしない。用途は決算書からの除外（絞り込み）であって、
    # 「決算振替ごとの試算表」を出すことではない。true にすると
    # get_trial_balance の group_by に増え、公開面が広がる
    aggregatable: false
    required_for: []
    description: >-
      仕訳の種類。決算振替は closing。**決算書は closing を除いて集計する**
      （除かないと、決算振替を記帳した瞬間に売上0・所得0の決算書になる。
      帳簿は追記型なので取り消せない）

  counterparty:
    value_type: Code
    aggregatable: true
    required_for: []
    description: "取引先コード。counterparties テーブルを参照"

  project:
    value_type: Code
    aggregatable: true
    required_for: []
    description: "案件・プロジェクトコード。クライアント別粗利の集計に使う"

  business_ratio:
    value_type: Decimal
    aggregatable: false
    required_for: []
    description: "家事按分の事業割合（0〜1）。税務調査時の根拠として記録する"

  invoice_reg_no:
    value_type: Text
    aggregatable: false
    required_for: []
    description: "適格請求書発行事業者登録番号（T + 13桁）"

  imported_tx_id:
    value_type: Text
    aggregatable: false
    required_for: []
    # **kaikei の imported_transactions の ID とは限らない。**
    #
    # journalize_transaction が付けるのは imported_transactions の UUID だが、
    # 外部システムから直に記帳する経路（freee からの同期など）は、その
    # システム側の取引 ID を入れる。検証帳簿の 2026 年分も一部が後者で、
    # imported_transactions は 0 行である——**UUID として解決しようとすると
    # 必ず失敗する。**
    #
    # 値の形で見分けるしかない（UUID か、外部システムの ID か）。辿る側は
    # どちらでもありうる前提で扱うこと。
    description: "この明細の元になった取引の ID（kaikei の imported_transactions の UUID か、外部システムの取引 ID）"
