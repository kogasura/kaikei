# crates/kaikei-app/Cargo.toml
#
# ★ application 層。I/O を行うのはこの層だけだが、infra（sqlx 等）は知らない ★
# ports（trait）を定義するのみで、実装は kaikei-store 等の下位層が持つ。
# CI (architecture.yml) が sqlx / kaikei-store / kaikei-jp への依存を検出したら失敗する。

[package]
name = "kaikei-app"
version = "0.0.1"
description = "application 層。ユースケースとポート（trait）定義"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kaikei-core = { path = "../kaikei-core", version = "0.0.1" }
kaikei-policy = { path = "../kaikei-policy", version = "0.0.1" }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# 非同期テスト（`#[tokio::test]`）専用のランタイム。normal edge には出ない
# （`cargo tree --edges normal` では検出されない。CI の
# 「kaikei-app は infra を知らない」ステップもこの edge を見ていない）。
tokio = { workspace = true }
# 統合テスト（tests/*.rs）は crate を外部依存としてリンクするため、
# lib 側の `#[cfg(test)]` は効かない（`testing` feature を明示しないと
# `kaikei_app::testing` が存在しない。`unresolved import` になる。PR-4
# レビューで実測確認済み）。この自己依存で `testing` feature を有効化する。
# `cargo tree --edges normal` には現れないので依存方向 CI に影響しない。
kaikei-app = { path = ".", features = ["testing"] }
# 後続 PR（PR-7 のユースケーステスト）が test-doubles（NoTaxPolicy 等）を
# 使うことを見越して、統合テストの経路でも有効化しておく。
kaikei-policy = { path = "../kaikei-policy", version = "0.0.1", features = ["test-doubles"] }
# ユースケースの貸借一致プロパティテスト専用。normal edge には出ない
# （`cargo tree --edges normal` では検出されない）。
proptest = { workspace = true }

[features]
# テスト用のインメモリ fake（testing.rs）を有効にする。他 crate のテストから
# 使うことを想定するため #[cfg(test)] だけでなく feature でも切る。
testing = []
