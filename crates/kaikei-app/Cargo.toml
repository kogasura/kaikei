# crates/kaikei-app/Cargo.toml
#
# ★ application 層。I/O を行うのはこの層だけだが、infra（sqlx 等）は知らない ★
# ports（trait）を定義するのみで、実装は kaikei-store 等の下位層が持つ。
# CI (architecture.yml) が sqlx / kaikei-store / kaikei-jp への依存を検出したら失敗する。

[package]
name = "kaikei-app"
version = "0.0.1"
description = "application 層。ユースケースとポート（trait）定義"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kaikei-core = { path = "../kaikei-core", version = "0.0.1" }
kaikei-policy = { path = "../kaikei-policy", version = "0.0.1" }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# 非同期テスト（`#[tokio::test]`）専用のランタイム。normal edge には出ない
# （`cargo tree --edges normal` では検出されない。CI の
# 「kaikei-app は infra を知らない」ステップもこの edge を見ていない）。
tokio = { workspace = true }

[features]
# テスト用のインメモリ fake（testing.rs）を有効にする。他 crate のテストから
# 使うことを想定するため #[cfg(test)] だけでなく feature でも切る。
testing = []
