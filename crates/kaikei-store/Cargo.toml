# crates/kaikei-store/Cargo.toml
#
# 永続化層（PostgreSQL）。kaikei-app のポート（trait）を実装する。
# kaikei-policy / kaikei-jp には依存しない（app が注入する。CI が検査する）。

[package]
name = "kaikei-store"
version = "0.0.1"
description = "永続化層。PostgreSQL に対する Data Mapper と read model"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kaikei-core = { path = "../kaikei-core", version = "0.0.1" }
kaikei-app = { path = "../kaikei-app", version = "0.0.1" }
sqlx = { workspace = true }
thiserror = { workspace = true }
# convert.rs: AccountingDate ⇄ NaiveDate / Timestamp ⇄ DateTime<Utc>
chrono = { workspace = true }
# tags.rs: TagSet ⇄ JSONB
serde_json = { workspace = true }
# tags.rs: TagValue::Decimal の文字列⇄Decimal変換（D-013と同じ理由で浮動小数点を経由しない）
rust_decimal = { workspace = true }
# journal/row.rs: id 列（UUID）⇄ kaikei_core::EntryId（kaikei_app::id 経由）
uuid = { workspace = true }
# PgTx の Drop: commit/rollback 忘れを tracing::warn! で知らせる（phase1計画 R10）
tracing = { workspace = true }
# 書き込み側（store/journal/chart/period/numbering）と read model（query）の
# 双方で #[async_trait] 実装に使う
async-trait = { workspace = true }
# bin/kaikei-migrate.rs 専用（#[tokio::main]）
tokio = { workspace = true }

[dev-dependencies]
# convert.rs / tags.rs の境界値プロパティテスト用。
proptest = { workspace = true }

[features]
# 既定オフ。PostgreSQL を要するテストをゲートする（`#[ignore]` は使わない。
# ローカルで無言にスキップされ、通っていないテストを通ったと錯覚するため）。
# `.github/workflows/database.yml` の `database` ジョブが
# `--features pg-tests` を付けて実行する。
pg-tests = []

# `tests/*.rs` を pg-tests 未指定時はコンパイル自体しない
# （DB不在の `cargo test --workspace` を汚さない）。
[[test]]
name = "migrations"
path = "tests/migrations.rs"
required-features = ["pg-tests"]

[[test]]
name = "privileges"
path = "tests/privileges.rs"
required-features = ["pg-tests"]

[[test]]
name = "append_only"
path = "tests/append_only.rs"
required-features = ["pg-tests"]

[[test]]
name = "schema_constraints"
path = "tests/schema_constraints.rs"
required-features = ["pg-tests"]

[[test]]
name = "round_trip"
path = "tests/round_trip.rs"
required-features = ["pg-tests"]

[[test]]
name = "trial_balance_differential"
path = "tests/trial_balance_differential.rs"
required-features = ["pg-tests"]
