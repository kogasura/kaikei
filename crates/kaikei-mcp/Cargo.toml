# crates/kaikei-mcp/Cargo.toml
#
# ★ MCP サーバー（presentation 層）★
# stdio で MCP クライアント（Claude Code 等）に会計操作を開く薄い層。
# ビジネスロジックはここに書かない（docs/07-mcp-server.md §4）。
#
# ★依存は最小限に保つ★
# 線上表現（金額の文字列化・列挙型の機械可読名・仕訳IDの表記・タグ値の変換・
# エラーコードの写像）は PR-B が kaikei-app / kaikei-jp の公開 API として
# 用意している。それらを使えば `uuid` / `rust_decimal` / `sqlx` を
# この crate に足す必要は無い（DECISIONS.md D-072 / D-079）。
# `.github/workflows/architecture.yml` の
# 「kaikei-mcp の依存は最小限」ステップが機械的に検査する（docs/07 §10 MC-30）。

[package]
name = "kaikei-mcp"
version = "0.0.1"
description = "MCP サーバー（stdio）。AI エージェント向けの会計操作インタフェース"
edition.workspace = true
# ★ workspace 既定（1.80）を継承しない ★
# rmcp 3.x の MSRV が 1.88 であるため個別に宣言する。workspace 全体を上げると
# kaikei-core まで「1.80 でビルドできる」性質を失う（DECISIONS.md D-071 / D-078）。
rust-version = "1.88"
license.workspace = true

[dependencies]
kaikei-core = { path = "../kaikei-core", version = "0.0.1" }
kaikei-app = { path = "../kaikei-app", version = "0.0.1" }
kaikei-jp = { path = "../kaikei-jp", version = "0.0.1" }
# PR-E: 合成ルート（PgStore / PgAuditSink / connect_app）の結線。
# ★sqlx は足さない★ sqlx の型を直接触りたくなったら、それは kaikei-store の
# 公開 API が足りないという別の問題である（MC-30 の許可リストにも sqlx は無い）。
# `connect_app` が返す `PgPool` は型推論で受けるので、型名を書く必要は無い。
kaikei-store = { path = "../kaikei-store", version = "0.0.1" }
rmcp = { workspace = true }
# PR-E で追加。`[workspace.dependencies]` の tokio は features = ["full"] だが、
# この crate が実際に要るのは #[tokio::main]（rt-multi-thread + macros）と
# stdio トランスポート（io-std）だけなので、意図が読めるよう個別に宣言する。
# （workspace の feature 統合により、他 crate が "full" を有効にしていれば
#  実際にビルドされるバイナリは同じになる。この宣言は「この層が何を必要と
#  しているか」の記録である。ソケットを開く feature（net）を含めていない
#  ことが docs/07-mcp-server.md §8 の「ソケットを一切開かない」と対応する）
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "io-std",
] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
# 起動テスト（tests/startup_*.rs）が子プロセスとしてこのバイナリを起動し、
# 応答をタイムアウト付きで読むために使う（process / time / io-util）。
# dev-dependencies も MC-30 の検査対象（`cargo metadata` は kind を問わず
# 全て列挙する。D-078）だが、tokio は許可リストに入っている。
tokio = { workspace = true }

[features]
# 既定オフ。PostgreSQL を要するテストをゲートする（kaikei-store /
# kaikei-e2e と同じ方式。`#[ignore]` による無言スキップは使わない）。
#
# ★このテストは使い捨てDBを作らない★
# kaikei-mcp は sqlx に依存しないため `#[sqlx::test]` を使えない。
# APP_DATABASE_URL が指す DB をそのまま使い、**勘定科目マスタの投入
# （追加のみ・冪等）と読み取りしか行わない**。仕訳は1件も書かない。
pg-tests = []

[[test]]
name = "startup_pg"
path = "tests/startup_pg.rs"
required-features = ["pg-tests"]
