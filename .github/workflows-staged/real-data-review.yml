# ★★ トークンを入れてから `.github/workflows/` へ移してください ★★
#
# **ここに置いてある間はレビューが動きません**（GitHub が読むのは
# `.github/workflows/` の下だけ）。動かすには次の2つが要ります:
#
#   1. Claude GitHub App をこのリポジトリに入れる（https://github.com/apps/claude）
#   2. サブスクリプションのトークンをリポジトリのシークレットに入れる
#      （Pro / Max / Team / Enterprise で使える）
#
#        claude setup-token                       # 手元で長期トークンを作る
#        gh secret set CLAUDE_CODE_OAUTH_TOKEN    # そのトークンを貼る
#
# **順番を逆にしない。** トークンが無いまま移すと、このジョブは空のトークンで
# 起動して毎回失敗する（`continue-on-error` で赤は付かないが、レビューは
# 動いていないのに動いているように見える。そのほうが質が悪い）。
#
#   git mv .github/workflows-staged/real-data-review.yml .github/workflows/
#   rmdir .github/workflows-staged
#   git commit -m "実データの自動レビューを置く"
#
# **必須チェックには登録しないこと。** 判定がブレるものを門番に据えると、
# 落ちても「またか」と再実行されるようになり、本物の検出まで一緒に無視される
# （CLAUDE.md §13 の必須チェックは決定的なものだけに絞る）。
#
# ----------------------------------------------------------------------
#
# .github/workflows/real-data-review.yml
#
# PR の差分を Claude に読ませ、**指摘があるときだけ** PR にコメントする。
#
# 正規表現の検査（`no-real-data`）は固有名詞を拾えない——「株式会社ビーテック」が
# 実在かどうかを denylist 無しにパターンで判定する方法は無く、denylist は置かないと
# 決めている（CLAUDE.md §15）。実際に見つかった漏洩は種類でいえば大半が固有名詞
# だったので、そこを埋める。
#
# 何を見るか・何を見ないかは `.claude/skills/real-data-review/SKILL.md` にある。
# **同じものを手元でも走らせられる**（Claude Code で `/real-data-review`）。

name: real-data-review

on:
  # push では走らせない（理由は supply-chain.yml の同じ位置のコメント）。
  pull_request:

permissions:
  contents: read
  # コメントを書くために要る。
  pull-requests: write
  issues: write
  # claude-code-action が GitHub App として認証するのに要る。
  id-token: write

jobs:
  real-data-review:
    runs-on: ubuntu-latest
    # **fork からの PR では走らせない。** public リポジトリでは fork 由来の実行に
    # シークレットが渡らないので、トークンが空になって失敗するだけになる。
    if: github.event.pull_request.head.repo.full_name == github.repository
    # 止まったまま6時間待たないための上限。
    timeout-minutes: 20
    steps:
      # スキルと投稿スクリプトをランナーに置くために要る。差分を読むので
      # 履歴も要る（fetch-depth: 1 だと base と比べられない）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: base の追跡ブランチを用意する
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      # **落ちても緑にする。** §14 が「鍵が無くても API が落ちていても終了
      # コードは 0」と決めている。門番ではないものが赤を出すと、他の赤と
      # 見分けが付かなくなる。
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        env:
          # 投稿スクリプトが使う。**`github_token` 入力には渡さない**
          # （渡すと action が GitHub App ではなくこのトークンで認証する）。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        with:
          # サブスクリプションのトークン。API キーではない。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `prompt` があると自動実行モードになる（`@claude` を待たない）。
          prompt: "/real-data-review"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 20
