# .github/workflows/supply-chain.yml
#
# 依存の脆弱性・ライセンス・出所を検査する。設定は deny.toml。
# kaikei-core の依存許可（rust_decimal/thiserrorのみ）自体は
# architecture.yml が別途検査する。

name: supply-chain

on:
  # **PR ブランチへの push では走らせない。** `pull_request` 側と二重に
  # 起動し、同じコミットに対して同じジョブが2回走る。CI の時間が倍に
  # なるうえ、片方がキューに滞留すると必須チェックが揃わずマージできない
  # （実際に27分滞留して止まった）。main への push はマージ後の確認として残す。
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # 毎週月曜 03:00 UTC。新規に公表された脆弱性を検知する

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    # 止まったまま6時間待たないための上限。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
