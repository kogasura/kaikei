# .github/workflows/supply-chain.yml
#
# 依存の脆弱性・ライセンス・出所を検査する。設定は deny.toml。
# kaikei-core の依存許可（rust_decimal/thiserrorのみ）自体は
# architecture.yml が別途検査する。

name: supply-chain

on:
  # **push では走らせない。PR だけで検査する。**
  #
  # PR ブランチへの push で走らせない理由: `pull_request` 側と二重に起動し、
  # 同じコミットに対して同じジョブが2回走る。CI の時間が倍になるうえ、
  # 片方がキューに滞留すると必須チェックが揃わずマージできない
  # （実際に27分滞留して止まった）。
  #
  # main への push でも走らせない理由: **検査済みの状態をもう一度検査するため。**
  # `pull_request` イベントが検査するのは PR head そのものではなく、
  # **base にマージしたコミット**である。ブランチ保護が `strict: true`
  # （マージ前にブランチを最新に保つ）なので、そのマージ先は必ず最新の main。
  # つまり**検査した状態がそのままマージ後の状態**になる。直 push も
  # ブランチ保護（`enforce_admins: true`）で塞がれているため、main への push は
  # マージによってしか起きない。
  #
  # ★この判断は `strict: true` に依存している★
  # strict を外すと、main が進んだ後の PR を再検査せずにマージできるようになり、
  # 「一度も検査されていない main」が生まれる。**strict を外すなら、ここに
  # `push: branches: [main]` を戻すこと。** 現在の設定はこれで確認できる:
  #
  #   gh api repos/kogasura/kaikei/branches/main/protection --jq '.required_status_checks.strict'
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # 毎週月曜 03:00 UTC。新規に公表された脆弱性を検知する

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    # 止まったまま6時間待たないための上限。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
