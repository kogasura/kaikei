# .github/workflows/architecture.yml
#
# 設計を人間の意志ではなく仕組みで守るための CI。
# これを無効化・緩和してはいけない。緩和が必要と判断したら人間に相談する。

name: architecture

on:
  push:
  pull_request:

jobs:
  dependency-direction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: kaikei-core は許可された依存のみ
        run: |
          set -euo pipefail
          ALLOWED="rust_decimal thiserror proptest"
          DEPS=$(cargo tree -p kaikei-core --edges normal --depth 1 --prefix none \
                 | sed 's/ v[0-9].*//' \
                 | grep -v '^kaikei-core$' \
                 | grep -v '^$' \
                 | sort -u)
          FAIL=0
          for d in $DEPS; do
            if ! echo "$ALLOWED" | grep -qw "$d"; then
              echo "::error::kaikei-core に禁止された依存: $d"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "kaikei-core は不変層です。DOMAIN.md と CLAUDE.md を確認してください。"
            echo "依存の追加が本当に必要な場合、実装を止めて人間に相談してください。"
            exit 1
          fi
          echo "OK: $DEPS"

      - name: kaikei-core は sqlx / tokio / serde を参照しない
        run: |
          set -euo pipefail
          # use 文・パス参照・extern crate という「実際のコード参照」のみを見る。
          # 単なる単語一致だと「chrono は使わない」のような、依存しない理由を
          # 説明する doc コメント自体を誤検知してしまうため。
          HITS=$(grep -rnE '(^|[^[:alnum:]_])(sqlx|tokio|serde|serde_json|chrono|uuid)::|^[[:space:]]*use[[:space:]]+(sqlx|tokio|serde|serde_json|chrono|uuid)\b|^[[:space:]]*extern[[:space:]]+crate[[:space:]]+(sqlx|tokio|serde|serde_json|chrono|uuid)\b' \
                 crates/kaikei-core/src/ \
                 | grep -vE ':[0-9]+:[[:space:]]*//' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::kaikei-core 内でインフラ層のクレートを参照しています"
            exit 1
          fi
          echo "OK"

      - name: kaikei-import は kaikei-core に依存しない（別コンテキスト）
        run: |
          set -euo pipefail
          if [ -d crates/kaikei-import ]; then
            if cargo tree -p kaikei-import --edges normal --prefix none \
               | grep -q 'kaikei-core'; then
              echo "::error::kaikei-import が kaikei-core に依存しています"
              echo "取込コンテキストと記帳コンテキストは分離してください（DECISIONS.md D-008）"
              exit 1
            fi
          fi
          echo "OK"

      - name: kaikei-policy は純粋層（依存）
        run: |
          set -euo pipefail
          ALLOWED="kaikei-core thiserror rust_decimal proptest"
          DEPS=$(cargo tree -p kaikei-policy --edges normal --depth 1 --prefix none \
                 | sed 's/ v[0-9].*//' \
                 | grep -v '^kaikei-policy$' \
                 | grep -v '^$' \
                 | sort -u)
          FAIL=0
          for d in $DEPS; do
            if ! echo "$ALLOWED" | grep -qw "$d"; then
              echo "::error::kaikei-policy に禁止された依存: $d"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "kaikei-policy は trait 定義のみの純粋層です。CLAUDE.md §1/§3 を確認してください。"
            exit 1
          fi
          echo "OK: $DEPS"

      - name: kaikei-policy に async / I/O が無い
        run: |
          set -euo pipefail
          # CLAUDE.md §1・§3 が明示的に禁止している（policy trait は純関数を保つ）が、
          # これまでこれを機械的に検査する CI が存在しなかった。
          HITS=$(grep -rnE 'async[[:space:]]+fn|async_trait|(^|[^[:alnum:]_])(sqlx|tokio|reqwest)::|std::fs' \
                 crates/kaikei-policy/src/ \
                 | grep -vE ':[0-9]+:[[:space:]]*//' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::kaikei-policy に async / I/O の兆候が検出されました"
            echo "policy trait は純関数を保つ規律です（CLAUDE.md §3）"
            exit 1
          fi
          echo "OK"

      - name: kaikei-jp は infra を知らない
        run: |
          set -euo pipefail
          FORBIDDEN="sqlx tokio kaikei-app kaikei-store kaikei-import"
          DEPS=$(cargo tree -p kaikei-jp --edges normal --prefix none \
                 | sed 's/ v[0-9].*//' \
                 | sort -u)
          FAIL=0
          for f in $FORBIDDEN; do
            if echo "$DEPS" | grep -qx "$f"; then
              echo "::error::kaikei-jp が infra 層に依存しています: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "kaikei-jp は kaikei-policy の実装層です。infra（sqlx/tokio等）や"
            echo "kaikei-app / kaikei-store / kaikei-import（上位・別文脈の層）を"
            echo "kaikei-jp 自身が知ってはいけません（CLAUDE.md §1）。"
            exit 1
          fi
          echo "OK"

      - name: kaikei-report は I/O を持たない
        run: |
          set -euo pipefail
          FORBIDDEN="sqlx tokio kaikei-store kaikei-import kaikei-mcp"
          DEPS=$(cargo tree -p kaikei-report --edges normal --prefix none                  | sed 's/ v[0-9].*//'                  | sort -u)
          FAIL=0
          for f in $FORBIDDEN; do
            if echo "$DEPS" | grep -qx "$f"; then
              echo "::error::kaikei-report が I/O 層に依存しています: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "kaikei-report は「データ → 文字列」の変換に徹する層です"
            echo "（docs/10-report.md §3）。DB から取ってくるのは呼び出し側"
            echo "（CLI バイナリ・kaikei-mcp）の仕事であり、この crate が"
            echo "I/O を知ると、出力のテストに DB が要るようになります。"
            exit 1
          fi
          echo "OK"

      - name: kaikei-jp-data は依存ゼロを保つ
        run: |
          set -euo pipefail
          # kaikei-jp-data は「データだけを持つ」crate（DECISIONS.md D-050）。
          # ロジックを持たないことの担保が doc コメントだけだと、うっかり
          # serde 等を足しても誰も気づかずマージできてしまう。
          # 禁止リスト方式（既知の危険な依存だけを弾く）ではなく、
          # 「何も依存していないこと」を検査する。
          DEPS=$(cargo tree -p kaikei-jp-data --edges normal --depth 1 --prefix none \
                 | sed 's/ v[0-9].*//' \
                 | grep -v '^kaikei-jp-data$' \
                 | grep -v '^$' \
                 | sort -u || true)
          if [ -n "$DEPS" ]; then
            echo "::error::kaikei-jp-data に依存が追加されています: $DEPS"
            echo ""
            echo "kaikei-jp-data は YAML を include_str! で公開するだけの"
            echo "データ crate です。YAML の解釈（デシリアライズ・検証）は"
            echo "kaikei-jp の責務です（DECISIONS.md D-050）。"
            exit 1
          fi
          echo "OK: 依存ゼロ"

      - name: kaikei-e2e は誰からも依存されない
        run: |
          set -euo pipefail
          # kaikei-e2e は合成ルートを模したE2Eテスト専用crate（DECISIONS.md D-068）。
          # kaikei-store も kaikei-jp も互いを知れないため、両方を知ってよい
          # 最上位の層として新設したが、依存される側に回った瞬間この位置づけが
          # 崩れる。存在しない場合（このPR以前のチェックアウト等）はスキップする。
          if [ ! -d crates/kaikei-e2e ]; then
            echo "OK: crates/kaikei-e2e が存在しません"
            exit 0
          fi
          # --edges を指定しない既定値（normal, build, dev）で見る。他の依存
          # 方向ステップは --edges normal のみを見ており、dev-dependency 経由の
          # 混入を検出できない（D-047 の「--edges normal は dev-dependency を
          # 見ない」注記と同型の抜け道）。kaikei-e2e はテスト専用crateであるため
          # 「テストフィクスチャを再利用したい」という誘惑が起きやすく、まさに
          # dev-dependency 経由で紛れ込みやすい。ここでは意図的に normal 依存
          # より広く見る（normal依存として混入した場合は kaikei-e2e が
          # kaikei-store に依存しているため循環依存となり、この時点で
          # 到達する前に `cargo tree` 自体がエラー終了して検出される）。
          #
          # stderr を stdout に混ぜない（`2>&1` にしない）。cargo は依存の
          # ダウンロード進捗（`Downloaded quick-error v1.2.3` 等）を stderr に
          # 出すため、混ぜると「kaikei-e2e に依存している crate」として
          # 誤検知する。ローカルは依存がキャッシュ済みで進捗が出ないため
          # 再現せず、**CI でだけ落ちる**（実際に踏んだ）。
          #
          # `cargo tree` 自体の失敗（normal 依存で混入した場合の循環依存など）は
          # 終了コードで別に判定する。
          if ! TREE=$(cargo tree --invert kaikei-e2e --prefix none); then
            echo "::error::cargo tree が失敗しました（kaikei-e2e への循環依存の可能性）"
            exit 1
          fi
          DEPENDENTS=$(echo "$TREE" | grep -v '^kaikei-e2e v' || true)
          if [ -n "$DEPENDENTS" ]; then
            echo "$DEPENDENTS"
            echo "::error::kaikei-e2e に依存している crate が見つかりました"
            echo "kaikei-e2e はE2Eテスト専用crateであり、他のどのcrateからも"
            echo "依存されてはいけません（normal依存だけでなくdev-dependencyも含む）"
            exit 1
          fi
          echo "OK"

      - name: kaikei-app は infra を知らない
        run: |
          set -euo pipefail
          FORBIDDEN="sqlx kaikei-store kaikei-jp kaikei-import"
          DEPS=$(cargo tree -p kaikei-app --edges normal --prefix none \
                 | sed 's/ v[0-9].*//' \
                 | sort -u)
          FAIL=0
          for f in $FORBIDDEN; do
            if echo "$DEPS" | grep -qx "$f"; then
              echo "::error::kaikei-app が infra 層に依存しています: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "kaikei-app は application 層です。infra（sqlx等）は注入される側で、"
            echo "app 自身が知ってはいけません（CLAUDE.md §1）。"
            exit 1
          fi
          echo "OK"

      - name: kaikei-store は kaikei-jp / kaikei-policy に依存しない
        run: |
          set -euo pipefail
          # ここで見るのは直接依存のみ（--depth 1）。kaikei-app 経由の
          # 推移的依存としては kaikei-policy が現れうるが、それは正当な依存方向。
          DEPS=$(cargo tree -p kaikei-store --edges normal --depth 1 --prefix none \
                 | sed 's/ v[0-9].*//' \
                 | grep -v '^kaikei-store$' \
                 | grep -v '^$')
          FAIL=0
          for forbidden in kaikei-jp kaikei-policy; do
            if echo "$DEPS" | grep -qx "$forbidden"; then
              echo "::error::kaikei-store が禁止された依存を直接持っています: $forbidden"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "kaikei-store は kaikei-app 経由でのみ上位層の型を扱ってください（ARCHITECTURE.md §3）"
            exit 1
          fi
          echo "OK: $DEPS"

      - name: kaikei-mcp の依存は最小限（MC-30）
        run: |
          set -euo pipefail
          # docs/07-mcp-server.md §4 の申し送り / §10 MC-30。
          #
          # PR-B は「下流が線上表現（金額の文字列化・仕訳IDの表記・タグ値の
          # 変換・エラーコードの写像）を再発明せずに済む」ことを狙って
          # kaikei-app / kaikei-jp に入口を用意し、それを
          # crates/{kaikei-app,kaikei-jp}/tests/contract_from_downstream.rs が
          # 検証している。しかし**プローブでは下流の依存が増えないことを
          # 検査できない**（統合テストのターゲットにはその crate の
          # dev-dependencies までリンクされるため、uuid / rust_decimal を
          # 直接使っても通ってしまう。PR-B で実測済み）。
          # kaikei-mcp が実在してはじめて、その Cargo.toml を機械的に見られる。
          #
          # ★禁止リストではなく許可リストにする★
          # 「uuid と rust_decimal さえ無ければよい」ではない。線上表現を
          # kaikei-app / kaikei-jp から取る限りこの層に依存が増える理由は無く、
          # 増えたこと自体が「MCP は薄い層」（docs/07 §4）を疑うべき兆候である。
          # 一覧を広げるときは、その PR で「なぜこの層に必要か」を説明すること。
          #
          # ★`cargo tree` ではなく `cargo metadata --no-deps` を読む★
          # `cargo tree` は既定で**ホストターゲットに解決される依存しか見ない**。
          # このジョブは ubuntu-latest で走るので、
          #   [target.'cfg(windows)'.dependencies] uuid = "1"
          # のように target 指定の下に置かれた依存は検査を素通りする（実測）。
          # 有効化されていない optional 依存も同様に見えない。
          # D-078 が塞いだつもりの「dev-dependency の抜け道」と同型の穴なので、
          # 宣言そのもの（Cargo.toml の記載）を読む。
          # `cargo metadata --no-deps` の packages[].dependencies[] は
          # **kind（normal/dev/build）・target 指定・optional を問わず全て**
          # 列挙されるため、抜け道が残らない。`jq` は ubuntu-latest に同梱。
          #
          # kaikei-store が許可リストに入っているのは、kaikei-mcp が本番で
          # 最初の**合成ルート**であり、PgStore の結線が要るため（docs/07 §4）。
          # 逆に sqlx は入れない——sqlx の型を kaikei-mcp が直接触りたくなったら、
          # それは kaikei-store の公開 API が足りていないという別の問題である。
          if [ ! -d crates/kaikei-mcp ]; then
            echo "OK: crates/kaikei-mcp が存在しません"
            exit 0
          fi
          ALLOWED="kaikei-core kaikei-app kaikei-jp kaikei-store rmcp tokio serde serde_json schemars"
          if ! METADATA=$(cargo metadata --no-deps --format-version 1); then
            echo "::error::cargo metadata が失敗しました"
            exit 1
          fi
          # `tr -d '\r'` は Windows の開発機で手元検証できるようにするため。
          # Git Bash の jq.exe は stdout をテキストモードで開くので各行に `\r` が
          # 付き、下の `case " $ALLOWED " in *" $d "*)` の完全一致が全滅して
          # 健全な状態でも全依存が「禁止された依存」になる（実測）。
          # ubuntu-latest の jq は `\r` を出さないので CI 側の挙動は変わらない。
          DEPS=$(echo "$METADATA" \
                 | jq -r '.packages[] | select(.name == "kaikei-mcp") | .dependencies[].name' \
                 | tr -d '\r' \
                 | sort -u)
          if [ -z "$DEPS" ]; then
            echo "::error::kaikei-mcp の依存を1つも取得できませんでした（検査が働いていません）"
            exit 1
          fi
          FAIL=0
          for d in $DEPS; do
            # ★完全一致で照合する★
            # `grep -qw` は `-` を単語構成文字として扱わないため、
            # `core` / `app` / `jp` / `store` / `kaikei` という名前の crate を
            # 直接依存に足しても許可リストの成分名に一致して緑になる（実測）。
            case " $ALLOWED " in
              *" $d "*) ;;
              *)
                echo "::error::kaikei-mcp に禁止された依存: $d"
                FAIL=1
                ;;
            esac
          done
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "kaikei-mcp は薄い presentation 層です（docs/07-mcp-server.md §4）。"
            echo "uuid / rust_decimal / sqlx を足したくなったら、まず"
            echo "kaikei_app::{amount,wire,id,currency} と kaikei_jp::{tags,tax} に"
            echo "同じことをする入口が無いか確認してください（DECISIONS.md D-072）。"
            echo "許可リストを広げる場合は、その PR で理由を説明すること。"
            exit 1
          fi
          echo "OK: $DEPS"

      - name: rehydrate の呼び出しは1箇所に限定
        run: |
          set -euo pipefail
          # 無検証 API（Phase 0 申し送り(a)）への防御。定義元 kaikei-core（自身の
          # src/journal.rs と、その挙動を直接検証する tests/journal.rs）と、検証を
          # 経由してから呼ぶ唯一の外部呼び出し元 kaikei-store/src/journal/mapper.rs
          # 以外からの呼び出しを禁止する。
          #
          # コメント行（`//` `///` `//!` `*` で始まる行）は除外する。
          # 「この API は CI が禁じているので使わない」と**説明している doc コメント**が
          # 検査に引っかかって落ちる、という誤検知を実際に2度踏んだ
          # （PR-4 の kaikei-app/src/error.rs、PR-7 の kaikei-jp/src/test_support.rs）。
          # 呼び出しはコメント行には書けないので、除外しても検出力は落ちない
          # （行頭が `//` の行だけを除くので、`foo(); // rehydrate` のような
          #   コード + 行末コメントは引き続き検出される）。
          HITS=$(grep -rn 'rehydrate' crates/ --include='*.rs' \
                 | grep -v '^crates/kaikei-core/' \
                 | grep -v '^crates/kaikei-store/src/journal/mapper.rs' \
                 | grep -vE ':[0-9]+:[[:space:]]*(//|\*)' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::rehydrate の呼び出しが許可された箇所以外に存在します"
            exit 1
          fi
          echo "OK"

      - name: 帳簿への UPDATE / DELETE が書かれていない
        run: |
          set -euo pipefail
          # 除外語 'ci-allow: append-only-probe' は権限テスト等で意図的に
          # UPDATE/DELETE を文字列として書く場合の明示的なマーカー（人間承認済み）。
          # 文字列連結（例: format!("UPDATE {}", "journal_entries")）ですり抜ける
          # 書き方は禁止（マーカーで意図を明示すること）。
          if grep -rniE '(update|delete)[[:space:]]+(from[[:space:]]+)?journal_(entries|lines)' \
             crates/ --include='*.rs' --include='*.sql' \
             | grep -v 'REVOKE' \
             | grep -v 'no_update' | grep -v 'no_delete' | grep -v 'no_truncate' \
             | grep -v 'reject_mutation' \
             | grep -v 'ci-allow: append-only-probe'; then
            echo "::error::帳簿本体への UPDATE / DELETE が検出されました"
            echo "訂正は逆仕訳（reverse）のみです（CLAUDE.md §2）"
            exit 1
          fi
          echo "OK"

      - name: JournalEntry に変更系メソッドが無い
        run: |
          set -euo pipefail
          if grep -nE 'fn[[:space:]]+(update|delete|set_|edit|modify)' \
             crates/kaikei-core/src/journal.rs crates/kaikei-core/src/journal/*.rs 2>/dev/null; then
            echo "::error::JournalEntry に変更系メソッドが定義されています"
            exit 1
          fi
          echo "OK"

      - name: f64 が金額に使われていない
        run: |
          set -euo pipefail
          # コメント行（f64 を使わない理由を説明する doc コメント）は誤検知のため除外する。
          HITS=$(grep -rn 'f64' crates/*/src/ 2>/dev/null | grep -vE ':[0-9]+:[[:space:]]*(//|\*)' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::f64 が検出されました。金額に浮動小数点を使わないでください"
            exit 1
          fi
          echo "OK"

  quality:
    runs-on: ubuntu-latest
    env:
      # kaikei-store が DB 不在でもコンパイルできるようにする。
      # これが無いと sqlx マクロが接続を要求し、後続 PR で必須チェックが赤のままマージ不能になる。
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
