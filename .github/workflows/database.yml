# .github/workflows/database.yml
#
# PostgreSQL を要するテスト専用のジョブ。`quality`（architecture.yml）は
# SQLX_OFFLINE=true でコンパイルするだけなので、実際に DB へ接続して
# マイグレーション・権限・トリガの実効性を検証するのはここだけ。
#
# ロール作成・権限付与は docker/postgres/init/01-roles.sql を docker-compose と
# 共通で使う（真実の点を1つにする）。

name: database

on:
  # **PR ブランチへの push では走らせない。** `pull_request` 側と二重に
  # 起動し、同じコミットに対して同じジョブが2回走る。CI の時間が倍に
  # なるうえ、片方がキューに滞留すると必須チェックが揃わずマージできない
  # （実際に27分滞留して止まった）。main への push はマージ後の確認として残す。
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kaikei_root
          POSTGRES_PASSWORD: kaikei_root_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: kaikei_root
      PGPASSWORD: kaikei_root_ci_password
      # psql は既定で「接続ユーザー名と同名のDB」に接続しようとする（この場合
      # kaikei_root）。サービス定義は POSTGRES_DB: postgres なので、明示しないと
      # `FATAL: database "kaikei_root" does not exist` で必ず失敗する
      # （docker-compose 側は docker-entrypoint.sh の docker_process_sql() が
      # 内部で --dbname "$POSTGRES_DB" を明示しているため問題にならない）。
      PGDATABASE: postgres
      KAIKEI_MIGRATOR_PASSWORD: kaikei_migrator_ci_password
      KAIKEI_APP_PASSWORD: kaikei_app_ci_password
      # sqlx のツール群（`#[sqlx::test]` / `cargo sqlx prepare` / `sqlx migrate run`）
      # がこの名前で読む接続。テスト用DBを作れる必要があるため kaikei_migrator を
      # 渡す（kaikei_app のままだと `permission denied for database`（42501）で
      # pg-tests が全滅する）。`.env.example` も同じ向きに揃えてある。
      DATABASE_URL: postgres://kaikei_migrator:kaikei_migrator_ci_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: postgresql-client をインストール
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: ロール作成と権限付与（docker-compose と同じファイルを流す）
        run: psql -f docker/postgres/init/01-roles.sql

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-sqlx-cli-0.8.6

      - name: sqlx-cli をインストール
        run: |
          set -euo pipefail
          # 上の actions/cache が ~/.cargo/bin/ を復元するため、2回目以降は
          # バイナリが既に存在する。cargo install は --force 無しだと
          # 「binary `sqlx` already exists in destination」で exit 101 になるので、
          # キャッシュヒット時はインストールを飛ばす。
          # （--force を付けるとキャッシュがあっても毎回ビルドし直すことになり、
          #   キャッシュを置いた意味が消える）
          if command -v sqlx >/dev/null 2>&1 && sqlx --version | grep -q '0\.8\.6'; then
            echo "キャッシュ済み: $(sqlx --version)"
          else
            cargo install sqlx-cli --version 0.8.6 \
              --no-default-features --features postgres,rustls --locked
          fi

      - name: マイグレーションを適用
        # 次の `sqlx prepare --check` は `.sqlx/` に無いクエリを実DBに問い合わせて
        # 検証するため、先にテーブルが存在している必要がある。
        # （`#[sqlx::test]` は各テストが自前のテストDBを作るのでこの適用とは独立だが、
        #   prepare --check は DATABASE_URL が指すDBそのものを見る）
        #
        # sqlx-cli の `migrate run` を使う（`kaikei-migrate` バイナリではなく）。
        # バイナリだと「ビルドするために kaikei-store のコンパイルが必要 →
        # そのコンパイルに sqlx::query! マクロの検証（テーブルの存在）が必要」
        # という鶏と卵になる。
        run: sqlx migrate run --source crates/kaikei-store/migrations

      - name: .sqlx キャッシュが最新か検証
        run: cargo sqlx prepare --workspace --check

      - name: pg-tests を実行
        run: cargo test -p kaikei-store --features pg-tests

      - name: pg-tests 対象への clippy
        # quality ジョブの clippy は --all-targets であって --all-features ではないため、
        # feature ゲートした pg-tests のテストは対象外になる。ここで拾う。
        run: cargo clippy -p kaikei-store --features pg-tests --all-targets -- -D warnings

      - name: kaikei-mcp のバイナリをビルド（kaikei-e2e の stdio 検査が起動する）
        # crates/kaikei-e2e/tests/mcp_stdio_server.rs は**実バイナリ**を子プロセス
        # として起動し、stdio で initialize → tools/call を送って
        # 「journal_entries が増える／増えない」と「audit_log に2行残る」を見る。
        # `CARGO_BIN_EXE_<name>` は同じ package のテストにしか渡らないので、
        # kaikei-e2e 側からは使えない（テストは target ディレクトリから辿る）。
        # cargo を入れ子で起動させない代わりに、ここで先にビルドしておく。
        run: cargo build -p kaikei-mcp

      - name: kaikei-cli のバイナリをビルド
        # tests/cli_verify.rs が `kaikei` を**実行ファイルとして**起動する。
        # verify が出す指摘は main.rs の中で関数を呼んでいるだけなので、
        # 呼び出しを消しても使い方の文言を見るテストは通ってしまう
        # （変異を入れて確かめたところ1件も落ちなかった）。
        # 指摘が本当に出ることは動かしてみないと分からない。
        run: cargo build -p kaikei-cli

      - name: kaikei-e2e の pg-tests を実行
        # Phase 2 PR-8: kaikei-jp（JpTaxPolicy 等）を実際に注入して記帳する
        # E2Eテスト（crates/kaikei-e2e）。kaikei-store とは別crateだが、同じ
        # マイグレーション（crates/kaikei-store/migrations）を使う
        # （#[sqlx::test(migrations = "...")] で相対パス指定。DECISIONS.md D-068）。
        run: cargo test -p kaikei-e2e --features pg-tests

      - name: kaikei-e2e の pg-tests 対象への clippy
        run: cargo clippy -p kaikei-e2e --features pg-tests --all-targets -- -D warnings

      - name: kaikei-mcp の pg-tests を実行（合成ルート）
        # Phase 3 PR-E: 本番の合成ルートが実 PostgreSQL に対して最後まで
        # 通ること（設定 → compose → 接続 → ロール検査 → 勘定科目マスタの投入）。
        #
        # kaikei-mcp は sqlx に依存しない（architecture.yml の MC-30）ため
        # `#[sqlx::test]` を使えず、APP_DATABASE_URL が指す DB をそのまま使う。
        # 書き込むのは勘定科目マスタだけ（追加のみ・冪等。DECISIONS.md D-081）で、
        # 仕訳は1件も書かない。
        #
        # 上の `sqlx migrate run` が適用済みの postgres データベースを使う
        # （DATABASE_URL と同じDBを、ロールだけ kaikei_app / kaikei_migrator に
        # 張り替えて指す）。所有者ロールでの起動が拒否されることの確認に
        # MIGRATOR_DATABASE_URL も渡す。
        env:
          APP_DATABASE_URL: postgres://kaikei_app:kaikei_app_ci_password@localhost:5432/postgres
          MIGRATOR_DATABASE_URL: postgres://kaikei_migrator:kaikei_migrator_ci_password@localhost:5432/postgres
        run: cargo test -p kaikei-mcp --features pg-tests

      - name: kaikei-mcp の pg-tests 対象への clippy
        run: cargo clippy -p kaikei-mcp --features pg-tests --all-targets -- -D warnings
