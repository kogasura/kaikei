# .github/workflows/commit-hygiene.yml
#
# コミットメッセージ・PR本文にAI帰属表示（Co-Authored-By: Claude 等）が
# 含まれていないことを検査する。マージ前にmainの履歴をクリーンに保つため。

name: commit-hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  no-ai-attribution:
    runs-on: ubuntu-latest
    # 止まったまま6時間待たないための上限。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: コミットメッセージにAI帰属表示が含まれていないか
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # メールアドレス・URLなど実際のトレーラー/フッターに固有の文字列のみを見る。
          # 「Co-Authored-By: Claude」のような自然文的なパターンは、この仕組み自体を
          # 説明するコミットメッセージ（このコミット等）を誤検知するため使わない。
          PATTERN='noreply@anthropic\.com|claude\.com/claude-code'
          BAD=$(git log --format=%B "$BASE_SHA".."$HEAD_SHA" | grep -inE "$PATTERN" || true)
          if [ -n "$BAD" ]; then
            echo "::error::コミットメッセージにAI帰属表示が含まれています:"
            echo "$BAD"
            echo ""
            echo "対象コミットのメッセージからAI帰属表示（Co-Authored-By: Claude 等）を取り除いてください。"
            exit 1
          fi
          echo "OK"

      - name: PR本文にAI帰属表示が含まれていないか
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          PATTERN='noreply@anthropic\.com|claude\.com/claude-code'
          if printf '%s' "$PR_BODY" | grep -inE "$PATTERN"; then
            echo "::error::PR本文にAI帰属表示が含まれています。PRの説明文から取り除いてください。"
            exit 1
          fi
          echo "OK"

      - name: PR本文に「公開してよい内容か」の確認欄があるか
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # **テンプレートは埋めさせられない。** `gh pr create --body` は
          # テンプレートを読まないので、CLI から作った PR には確認欄そのものが
          # 載らない。実際、この規律を入れた後の PR がいくつもその形だった。
          #
          # ここで見るのは「欄があるか」と「チェックが入っているか」だけである。
          # 中身が本当に安全かは人が見るしかないが、**確認したという印すら
          # 無いまま通るのは塞げる。**
          if ! printf '%s' "$PR_BODY" | grep -q "公開してよい内容か"; then
            echo "::error::PR本文に「公開してよい内容か【必須】」の欄がありません。"
            echo ""
            echo ".github/pull_request_template.md の該当箇所を貼り、確認してください。"
            echo "gh pr create --body で作ると、テンプレートは自動では入りません。"
            exit 1
          fi
          # 未チェックの箱が残っていないか。
          if printf '%s' "$PR_BODY" | grep -qE '^\s*-\s*\[ \]'; then
            echo "::error::「公開してよい内容か」の確認欄に、未チェックの項目が残っています:"
            printf '%s' "$PR_BODY" | grep -E '^\s*-\s*\[ \]'
            exit 1
          fi
          echo "OK"
