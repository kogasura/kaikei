# 依存の更新を Dependabot に任せる。
#
# ■ なぜ入れるか
#
# このリポジトリは**公開**である。依存に脆弱性が出たとき、こちらが気づく
# 手立てが `cargo-deny`（supply-chain.yml）の advisories 検査しかない。
# あれは**手を入れたときにしか走らない**ので、放置している間に出た勧告には
# 気づけない。Dependabot は定期的に見て PR を作る。
#
# ■ このファイルが担うのは「バージョン更新」だけである
#
# Dependabot には3つの機能があり、**このファイルはそのうち1つしか設定しない。**
# 残り2つはリポジトリ設定側にあり、ここを読んでも有効かどうか分からない
# （実際、導入から一度も有効になっていないことに後から気づいた）。
#
#   1. version updates ........ このファイル。毎週、古い依存の PR を作る
#   2. Dependabot alerts ...... 勧告が出た時点で通知する
#   3. security updates ....... 勧告が出た依存の修正 PR を**即座に**作る
#
# 2 と 3 は 2026-08-19 に有効化した。現在の状態はこれで確認できる:
#
#   gh api repos/kogasura/kaikei --jq '.security_and_analysis'
#
# **3 が作る PR は下の open-pull-requests-limit の枠外**である。あの上限は
# version updates にしか効かない。勧告が出たときだけなので頻度は低い。
#
# ■ まとめて上げる
#
# crate 数が多いので、1つずつ PR が来ると CI が詰まる。patch と minor は
# まとめる。**major は分ける**——壊れる可能性があるものを他と混ぜると、
# どれが原因か分からなくなる。

version: 2
updates:
  # ---- Rust（ワークスペース全体）----
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # 壊れにくい更新はまとめる。
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # ---- GitHub Actions ----
  #
  # `uses:` のバージョンが古いまま動き続けても誰も困らないので、放って
  # おくと気づかない。actions/checkout などは**実際に非推奨になる**ので、
  # 動かなくなる前に上げたい。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
