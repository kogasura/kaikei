# ワークスペースルートの Cargo.toml
# 実装開始時にプロジェクトルートへコピーする

[workspace]
resolver = "2"
members = [
    "crates/kaikei-core",
    "crates/kaikei-policy",
    "crates/kaikei-store",
    "crates/kaikei-app",
    "crates/kaikei-jp",
    "crates/kaikei-jp-data",
    # Phase 2 PR-8: 合成ルートを模したE2Eテスト専用crate（DECISIONS.md D-068）。
    # 他のどのcrateからも依存されない（architecture.yml が検査する）。
    "crates/kaikei-e2e",
    # Phase 3 PR-D: MCP サーバー（stdio）。members に入れないと
    # `cargo test --workspace` / `cargo clippy --workspace` の対象にすらならない。
    # rust-version だけは workspace 既定（1.80）を継承せず個別宣言している
    # （rmcp の MSRV。DECISIONS.md D-071 / D-078）。
    "crates/kaikei-mcp",
    # Phase 5: 帳簿の出力（CSV / 印刷用 HTML）。I/O を持たない
    # （docs/10-report.md §3。architecture.yml が sqlx/tokio 非依存を検査する）。
    "crates/kaikei-report",
    # Phase 5: 帳簿を書き出す CLI。合成ルートなので store と jp の両方を知る。
    "crates/kaikei-cli",
    # Phase 4: 証憑ファイルの保存（内容の SHA-256 で管理）。
    # ファイルシステムを触るが DB は知らない（docs/06-documents.md）。
    "crates/kaikei-blob",
    # Phase 1 以降で追加
    # Phase 4: 明細の取込。**kaikei-core に依存しない**
    # （docs/05-csv-import.md §1。architecture.yml が検査する）。
    "crates/kaikei-import",
    # "crates/kaikei-import-data",
    # "crates/kaikei-api",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = []
repository = ""

[workspace.dependencies]
# ---- kaikei-core が使ってよいのはこの 2 つだけ ----
rust_decimal = { version = "1", default-features = false, features = ["maths"] }
thiserror = "2"

# ---- Phase 1 以降。core には絶対に入れない ----
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml (dtolnay) は 2024 年にアーカイブされ、作者自身が別ライブラリへの
# 移行を勧めている。serde_yaml 0.9 の直系フォーク（API互換）である serde_norway
# に置き換える。7年保存の会計データを扱う基盤に、保守されていないYAMLパーサを
# 置かない（DECISIONS.md D-049）
serde_norway = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
csv = "1"
encoding_rs = "0.8"          # 邦銀 CSV の Shift-JIS 変換に必須
sha2 = "0.11"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

# ---- Phase 3: MCP サーバー（kaikei-mcp のみが使う） ----
# 公式 Rust SDK。default-features を切り、使うトランスポート（stdio）と
# サーバ機能だけを明示する（DECISIONS.md D-071）。HTTP/SSE 系の feature を
# 有効にしない＝ソケットを開く経路をビルドに含めない。
rmcp = { version = "3", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
# ツールの input_schema 生成。rmcp が公開シグネチャで使うバージョンに合わせる
# （ずれると `JsonSchema` の実装が別トレイトになりコンパイルが通らない）。
schemars = "1"

# ---- dev ----
proptest = "1"
