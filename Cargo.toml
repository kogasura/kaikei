# ワークスペースルートの Cargo.toml
# 実装開始時にプロジェクトルートへコピーする

[workspace]
resolver = "2"
members = [
    "crates/kaikei-core",
    "crates/kaikei-policy",
    "crates/kaikei-store",
    "crates/kaikei-app",
    "crates/kaikei-jp",
    "crates/kaikei-jp-data",
    # Phase 1 以降で追加
    # "crates/kaikei-blob",
    # "crates/kaikei-import",
    # "crates/kaikei-import-data",
    # "crates/kaikei-report",
    # "crates/kaikei-api",
    # "crates/kaikei-mcp",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = []
repository = ""

[workspace.dependencies]
# ---- kaikei-core が使ってよいのはこの 2 つだけ ----
rust_decimal = { version = "1", default-features = false, features = ["maths"] }
thiserror = "2"

# ---- Phase 1 以降。core には絶対に入れない ----
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml (dtolnay) は 2024 年にアーカイブされ、作者自身が別ライブラリへの
# 移行を勧めている。serde_yaml 0.9 の直系フォーク（API互換）である serde_norway
# に置き換える。7年保存の会計データを扱う基盤に、保守されていないYAMLパーサを
# 置かない（DECISIONS.md D-049）
serde_norway = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
csv = "1"
encoding_rs = "0.8"          # 邦銀 CSV の Shift-JIS 変換に必須
sha2 = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

# ---- dev ----
proptest = "1"
